name: Monetization Lynk Diagnostics

on:
  push:
    branches: [build/monetization-engine-v1]
    paths:
      - 'activation/monetization-lynk-diagnostics.request'
      - '.github/workflows/monetization-lynk-diagnostics.yml'

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Require diagnostics marker and Cloudflare credentials
        shell: bash
        run: |
          test -f activation/monetization-lynk-diagnostics.request
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Recent sanitized Lynk integration log
        shell: bash
        run: |
          npx wrangler d1 execute umkm-content-os-db --remote --config wrangler.monetization.jsonc \
            --command="SELECT id,operation,status,error_message,correlation_id,metadata_json,created_at FROM monetization_integration_logs WHERE provider='lynk' ORDER BY id DESC LIMIT 15;"
      - name: Recent Lynk Revenue Ledger rows
        shell: bash
        run: |
          npx wrangler d1 execute umkm-content-os-db --remote --config wrangler.monetization.jsonc \
            --command="SELECT id,transaction_id,event_type,source,offer_id,campaign_id,content_item_id,gross_amount,fee_amount,net_amount,margin_amount,currency,status,occurred_at FROM monetization_revenue_events WHERE source='lynk' ORDER BY occurred_at DESC LIMIT 10;"
      - name: Recent Lynk attribution rows
        shell: bash
        run: |
          npx wrangler d1 execute umkm-content-os-db --remote --config wrangler.monetization.jsonc \
            --command="SELECT a.revenue_event_id,a.model,a.attribution_status,a.first_content_item_id,a.first_campaign_id,a.first_offer_id,a.last_content_item_id,a.last_campaign_id,a.last_offer_id,r.transaction_id,r.gross_amount FROM monetization_attributions a JOIN monetization_revenue_events r ON r.id=a.revenue_event_id WHERE r.source='lynk' ORDER BY r.occurred_at DESC LIMIT 10;"
      - name: Lynk product mappings
        shell: bash
        run: |
          npx wrangler d1 execute umkm-content-os-db --remote --config wrangler.monetization.jsonc \
            --command="SELECT provider,external_type,external_id,offer_id,campaign_id,content_item_id,updated_at FROM monetization_provider_mappings WHERE provider='lynk' ORDER BY updated_at DESC LIMIT 20;"
      - name: Active monetization candidates
        shell: bash
        run: |
          npx wrangler d1 execute umkm-content-os-db --remote --config wrangler.monetization.jsonc \
            --command="SELECT id,name,offer_type,status,destination_url FROM monetization_offers WHERE brand_id='brand-umkm-naik-kelas' ORDER BY updated_at DESC LIMIT 20; SELECT id,name,status,objective,default_offer_id FROM monetization_campaigns WHERE brand_id='brand-umkm-naik-kelas' ORDER BY updated_at DESC LIMIT 20; SELECT id,title,status,published_at FROM content_items ORDER BY updated_at DESC LIMIT 20;"
