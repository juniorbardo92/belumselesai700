name: Monetization Backup Restore Acceptance

on:
  push:
    branches: [build/monetization-engine-v1]
    paths:
      - 'activation/monetization-backup-restore-acceptance.request'
      - '.github/workflows/monetization-backup-restore-acceptance.yml'

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  restore-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Require acceptance marker
        shell: bash
        run: |
          test -f activation/monetization-backup-restore-acceptance.request
          grep -q '^approved=yes$' activation/monetization-backup-restore-acceptance.request
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Export production D1 backup read-only
        shell: bash
        run: |
          mkdir -p /tmp/backup
          npx wrangler d1 export umkm-content-os-db --remote --config wrangler.monetization.jsonc --output=/tmp/backup/umkm-content-os.sql
          test -s /tmp/backup/umkm-content-os.sql
          grep -q 'CREATE TABLE' /tmp/backup/umkm-content-os.sql
          grep -q 'monetization_revenue_events' /tmp/backup/umkm-content-os.sql
          echo "backup_bytes=$(wc -c < /tmp/backup/umkm-content-os.sql)"
      - name: Create isolated temporary restore database
        id: create
        shell: bash
        run: |
          DB_NAME="umkm-monetization-restore-${GITHUB_RUN_ID}"
          echo "db_name=$DB_NAME" >> "$GITHUB_OUTPUT"
          npx wrangler d1 create "$DB_NAME" | tee /tmp/create.txt
          test -n "$DB_NAME"
      - name: Restore exported backup into temporary D1
        shell: bash
        run: |
          DB_NAME='${{ steps.create.outputs.db_name }}'
          npx wrangler d1 execute "$DB_NAME" --remote --file=/tmp/backup/umkm-content-os.sql | tee /tmp/restore.txt
      - name: Verify restored base and monetization data
        shell: bash
        run: |
          DB_NAME='${{ steps.create.outputs.db_name }}'
          npx wrangler d1 execute "$DB_NAME" --remote --command="SELECT COUNT(*) brands FROM brands; SELECT COUNT(*) content_items FROM content_items; SELECT COUNT(*) revenue_events FROM monetization_revenue_events; SELECT COUNT(*) lynk_transactions FROM monetization_revenue_events WHERE source='lynk';" | tee /tmp/verify.txt
          grep -Eq '"brands"[[:space:]]*:[[:space:]]*[1-9]' /tmp/verify.txt
          grep -Eq '"revenue_events"[[:space:]]*:[[:space:]]*[1-9]' /tmp/verify.txt
          grep -Eq '"lynk_transactions"[[:space:]]*:[[:space:]]*[1-9]' /tmp/verify.txt
      - name: Delete temporary restore database
        if: always()
        shell: bash
        run: |
          DB_NAME='${{ steps.create.outputs.db_name }}'
          if [ -n "$DB_NAME" ]; then
            npx wrangler d1 delete "$DB_NAME" --skip-confirmation || true
          fi
