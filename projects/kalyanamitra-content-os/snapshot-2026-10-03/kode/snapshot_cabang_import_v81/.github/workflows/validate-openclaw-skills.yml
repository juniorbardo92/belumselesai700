name: Validate OpenClaw Skills

on:
  push:
    branches: [build/monetization-engine-v1]
    paths:
      - 'integrations/openclaw/**'
      - 'scripts/openclaw-skill-package.test.mjs'
      - '.github/workflows/validate-openclaw-skills.yml'
  pull_request:
    paths:
      - 'integrations/openclaw/**'
      - 'scripts/openclaw-skill-package.test.mjs'
      - '.github/workflows/validate-openclaw-skills.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate skill metadata, fail-closed behavior, requests, and secret hygiene
        run: node scripts/openclaw-skill-package.test.mjs
