name: Monetization Runtime Secrets Check

on:
  push:
    branches: [build/monetization-engine-v1]
    paths:
      - '.github/workflows/monetization-runtime-secrets-check.yml'
      - 'activation/runtime-secrets-check.request'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      MONETIZATION_INGEST_TOKEN: ${{ secrets.MONETIZATION_INGEST_TOKEN }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      LYNK_WEBHOOK_SECRET: ${{ secrets.LYNK_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Check mandatory activation secrets without exposing values
        shell: bash
        run: |
          missing=0
          for name in MONETIZATION_INGEST_TOKEN DEEPSEEK_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "MISSING: $name"
              missing=1
            else
              echo "READY: $name"
            fi
          done
          if [ -z "$LYNK_WEBHOOK_SECRET" ]; then
            echo "OPTIONAL-BEFORE-LYNK-TEST: LYNK_WEBHOOK_SECRET"
          else
            echo "READY: LYNK_WEBHOOK_SECRET"
          fi
          exit $missing
