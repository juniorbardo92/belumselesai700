name: Monetization Lynk Real Reconciliation

on:
  push:
    branches: [build/monetization-engine-v1]
    paths:
      - 'activation/monetization-lynk-real-reconciliation.request'
      - '.github/workflows/monetization-lynk-real-reconciliation.yml'

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  MONETIZATION_INGEST_TOKEN: ${{ secrets.MONETIZATION_INGEST_TOKEN }}

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Require real reconciliation marker
        shell: bash
        run: |
          test -f activation/monetization-lynk-real-reconciliation.request
          grep -q '^approved=yes$' activation/monetization-lynk-real-reconciliation.request
          test -n "$MONETIZATION_INGEST_TOKEN"
      - name: Verify real Lynk ledger row in narrow provider-time period
        shell: bash
        run: |
          npx wrangler d1 execute umkm-content-os-db --remote --config wrangler.monetization.jsonc \
            --command="SELECT transaction_id,gross_amount,net_amount,status,occurred_at FROM monetization_revenue_events WHERE source='lynk' AND transaction_id='50d33327b065ace2cb15a9e0026a041b' AND occurred_at>='2026-08-31T14:21:00' AND occurred_at<='2026-08-31T14:24:00';" | tee /tmp/real-lynk.txt
          grep -q '50d33327b065ace2cb15a9e0026a041b' /tmp/real-lynk.txt
          grep -Eq '"gross_amount"[[:space:]]*:[[:space:]]*5000' /tmp/real-lynk.txt
      - name: Reconcile one real Lynk transaction against Revenue Ledger
        shell: bash
        run: |
          code=$(curl --silent --show-error --output /tmp/reconciliation.json --write-out '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $MONETIZATION_INGEST_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{"source":"lynk","periodStart":"2026-08-31T14:21:00","periodEnd":"2026-08-31T14:24:00","externalTransactionCount":1,"externalGrossAmount":5000,"metadata":{"evidence":"real-lynk-payment.received","transactionId":"50d33327b065ace2cb15a9e0026a041b","timestampBasis":"provider-createdAt"}}' \
            'https://umkm-monetization-engine.ruang-belajar-mandiri01.workers.dev/api/monetization/reconciliation')
          cat /tmp/reconciliation.json
          test "$code" = '201'
          grep -q '"status":"matched"' /tmp/reconciliation.json
          grep -Eq '"transactions"[[:space:]]*:[[:space:]]*0' /tmp/reconciliation.json
          grep -Eq '"gross"[[:space:]]*:[[:space:]]*0' /tmp/reconciliation.json
