name: Monetization Production Preflight

on:
  push:
    branches: [build/monetization-engine-v1]
    paths:
      - '.github/workflows/monetization-preflight.yml'
      - 'activation/monetization-preflight.request'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify Cloudflare credentials are configured
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 2; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 2; }
      - name: Verify Cloudflare access
        run: npx wrangler whoami
      - name: Verify production D1 binding target
        run: npx wrangler d1 info umkm-content-os-db
      - name: Export production D1 backup before monetization activation
        run: |
          mkdir -p backup
          npx wrangler d1 export umkm-content-os-db --remote --output=backup/umkm-content-os-pre-monetization.sql
      - name: Build existing Content OS
        run: npm run build
      - name: Build Monetization Engine
        run: npm run build:monetization
      - name: Save pre-activation D1 backup
        uses: actions/upload-artifact@v4
        with:
          name: umkm-content-os-pre-monetization-d1-backup
          path: backup/umkm-content-os-pre-monetization.sql
          if-no-files-found: error
          retention-days: 7
