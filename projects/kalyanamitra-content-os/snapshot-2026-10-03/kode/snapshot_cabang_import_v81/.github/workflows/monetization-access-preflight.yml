name: Monetization Access Preflight

on:
  push:
    branches: [build/monetization-engine-v1]
    paths:
      - 'activation/monetization-access-preflight.request'
      - '.github/workflows/monetization-access-preflight.yml'

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require marker and credentials
        shell: bash
        run: |
          test -f activation/monetization-access-preflight.request
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Inspect Access application metadata read-only
        shell: bash
        run: |
          code=$(curl --silent --show-error --output /tmp/access-apps.json --write-out '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/access/apps")
          echo "HTTP status: $code"
          test "$code" = '200'
          jq -r '
            if .success != true then error("Cloudflare Access API unsuccessful") else . end
            | "app_count=" + ((.result | length) | tostring),
              (.result[]? | {id, name, domain, type, session_duration})
          ' /tmp/access-apps.json
      - name: Confirm first-party domain runtime remains healthy
        shell: bash
        run: |
          code=$(curl --silent --show-error --output /tmp/go-status.json --write-out '%{http_code}' \
            'https://go.umkmnaikkelas.id/api/monetization/status')
          cat /tmp/go-status.json
          test "$code" = '200'
          grep -q '"ok":true' /tmp/go-status.json
