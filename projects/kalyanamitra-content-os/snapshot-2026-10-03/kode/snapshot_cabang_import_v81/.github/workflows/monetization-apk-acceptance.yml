name: Monetization APK Acceptance

on:
  push:
    branches: [build/monetization-engine-v1]
    paths:
      - 'activation/monetization-apk-acceptance.request'
      - '.github/workflows/monetization-apk-acceptance.yml'

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  MONETIZATION_INGEST_TOKEN: ${{ secrets.MONETIZATION_INGEST_TOKEN }}
  BASE_URL: https://umkm-monetization-engine.ruang-belajar-mandiri01.workers.dev

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require APK acceptance marker
        shell: bash
        run: |
          test -f activation/monetization-apk-acceptance.request
          grep -q '^approved=yes$' activation/monetization-apk-acceptance.request
          test -n "$MONETIZATION_INGEST_TOKEN"
      - name: Prepare isolated offer
        id: ids
        shell: bash
        run: |
          TAG="apk-acceptance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          BODY=$(printf '{"id":"%s-offer","name":"[APK ACCEPTANCE] %s","type":"affiliate","destinationUrl":"https://example.com/apk-acceptance","status":"active","metadata":{"acceptanceTag":"%s"}}' "$TAG" "$TAG" "$TAG")
          curl --fail --silent -X POST -H "Authorization: Bearer $MONETIZATION_INGEST_TOKEN" -H 'Content-Type: application/json' --data "$BODY" "$BASE_URL/api/monetization/offers" | tee /tmp/offer.json
          grep -q '"ok":true' /tmp/offer.json
      - name: Acceptance - APK event and idempotency
        shell: bash
        env:
          TAG: ${{ steps.ids.outputs.tag }}
        run: |
          BODY=$(printf '{"eventType":"app_install","appInstanceId":"%s-device","sessionId":"%s-session","appVersion":"1.0.0","devicePlatform":"android","idempotencyKey":"%s:install"}' "$TAG" "$TAG" "$TAG")
          first=$(curl --silent --output /tmp/app1.json --write-out '%{http_code}' -X POST -H "Authorization: Bearer $MONETIZATION_INGEST_TOKEN" -H 'Content-Type: application/json' --data "$BODY" "$BASE_URL/api/monetization/app/events")
          cat /tmp/app1.json
          test "$first" = '201'
          grep -q '"duplicate":false' /tmp/app1.json
          second=$(curl --silent --output /tmp/app2.json --write-out '%{http_code}' -X POST -H "Authorization: Bearer $MONETIZATION_INGEST_TOKEN" -H 'Content-Type: application/json' --data "$BODY" "$BASE_URL/api/monetization/app/events")
          cat /tmp/app2.json
          test "$second" = '200'
          grep -q '"duplicate":true' /tmp/app2.json
      - name: Acceptance - APK monetization handoff
        shell: bash
        env:
          TAG: ${{ steps.ids.outputs.tag }}
        run: |
          BODY=$(printf '{"appInstanceId":"%s-device","sessionId":"%s-session","offerId":"%s-offer","appVersion":"1.0.0","idempotencyKey":"%s:handoff"}' "$TAG" "$TAG" "$TAG" "$TAG")
          code=$(curl --silent --output /tmp/handoff.json --write-out '%{http_code}' -X POST -H "Authorization: Bearer $MONETIZATION_INGEST_TOKEN" -H 'Content-Type: application/json' --data "$BODY" "$BASE_URL/api/monetization/app/handoff")
          cat /tmp/handoff.json
          test "$code" = '201'
          grep -q '"ok":true' /tmp/handoff.json
          grep -q '"destinationUrl":"https://example.com/apk-acceptance"' /tmp/handoff.json
          grep -q '"attributionVisitorId"' /tmp/handoff.json
      - name: Verify APK events persisted with pseudonymous attribution
        shell: bash
        env:
          TAG: ${{ steps.ids.outputs.tag }}
        run: |
          npx wrangler d1 execute umkm-content-os-db --remote --config wrangler.monetization.jsonc --command="SELECT event_type,source,platform,visitor_id,idempotency_key FROM monetization_events WHERE visitor_id='${TAG}-device' ORDER BY occurred_at;" | tee /tmp/events.txt
          grep -q 'app_install' /tmp/events.txt
          grep -q 'affiliate_click' /tmp/events.txt
          grep -Eq '"source"[[:space:]]*:[[:space:]]*"apk"' /tmp/events.txt
      - name: Cleanup APK acceptance data
        if: always()
        shell: bash
        env:
          TAG: ${{ steps.ids.outputs.tag }}
        run: |
          if [ -z "$TAG" ]; then exit 0; fi
          npx wrangler d1 execute umkm-content-os-db --remote --config wrangler.monetization.jsonc --command="DELETE FROM monetization_events WHERE visitor_id='${TAG}-device' OR idempotency_key LIKE '${TAG}:%'; DELETE FROM monetization_offers WHERE id='${TAG}-offer';"
          npx wrangler d1 execute umkm-content-os-db --remote --config wrangler.monetization.jsonc --command="SELECT (SELECT COUNT(*) FROM monetization_events WHERE visitor_id='${TAG}-device') events,(SELECT COUNT(*) FROM monetization_offers WHERE id='${TAG}-offer') offers;" | tee /tmp/cleanup.txt
          grep -Eq '"events"[[:space:]]*:[[:space:]]*0' /tmp/cleanup.txt
          grep -Eq '"offers"[[:space:]]*:[[:space:]]*0' /tmp/cleanup.txt
