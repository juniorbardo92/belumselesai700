name: Monetization Deployment Inventory

on:
  push:
    branches: [build/monetization-engine-v1]
    paths:
      - '.github/workflows/monetization-deployment-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: umkm-monetization-production-change-freeze
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture current deployment and versions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler deployments status --json --config wrangler.monetization.jsonc | tee deployment-status.json
          npx wrangler versions list --json --config wrangler.monetization.jsonc | tee versions-list.json
          node - <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync('deployment-status.json','utf8'));
          const latest=Array.isArray(raw)?raw[0]:raw;
          const versions=latest?.versions??latest?.deployment?.versions??[];
          if(!versions.length) throw new Error('active deployment has no versions');
          const rows=versions.map(item=>({
            id:item.version_id??item.versionId??item.id,
            percentage:Number(item.percentage??item.traffic_percentage)
          }));
          if(rows.some(row=>!row.id||!Number.isFinite(row.percentage))) throw new Error(`invalid active deployment: ${JSON.stringify(rows)}`);
          fs.writeFileSync('active-versions.json',JSON.stringify(rows,null,2));
          fs.writeFileSync('active-version-ids.txt',rows.map(row=>row.id).join('\n')+'\n');
          NODE
          while IFS= read -r version_id; do
            npx wrangler versions view "$version_id" --json --config wrangler.monetization.jsonc | tee "version-${version_id}.json"
          done < active-version-ids.txt
      - name: Probe each active runtime with exact version override
        run: |
          set -euo pipefail
          while IFS= read -r version_id; do
            code=$(curl --silent --show-error --max-time 20 --retry 3 --retry-all-errors \
              --output "runtime-${version_id}.json" --write-out '%{http_code}' \
              -H "Cloudflare-Workers-Version-Overrides: umkm-monetization-engine=\"${version_id}\"" \
              'https://go.umkmnaikkelas.id/api/monetization/version')
            printf '%s\n' "$code" > "runtime-${version_id}.status"
          done < active-version-ids.txt
          node - <<'NODE'
          const fs=require('fs');
          const active=JSON.parse(fs.readFileSync('active-versions.json','utf8'));
          const probes=active.map(row=>{
            const status=Number(fs.readFileSync(`runtime-${row.id}.status`,'utf8').trim());
            const raw=fs.readFileSync(`runtime-${row.id}.json`,'utf8');
            let body=null;
            try{body=JSON.parse(raw)}catch{}
            if(status===200&&(body?.ok!==true||typeof body?.version!=='string')) throw new Error(`invalid runtime contract for ${row.id}`);
            if(![200,401,403].includes(status)) throw new Error(`unexpected runtime status ${status} for ${row.id}`);
            return {...row,httpStatus:status,reportedVersion:body?.version??null,runtimeVersionId:body?.runtimeVersion?.id??null,securityConfiguration:body?.securityConfiguration??null};
          });
          fs.writeFileSync('active-runtime-contracts.json',JSON.stringify(probes,null,2));
          console.log(JSON.stringify(probes,null,2));
          NODE
      - name: Verify Cloudflare Access with a read-only request
        shell: bash
        run: |
          code=$(curl --silent --show-error --output /dev/null --dump-header /tmp/access-headers.txt --write-out '%{http_code}' \
            'https://umkm-content-os.ruang-belajar-mandiri01.workers.dev/monetization' || true)
          location=$(sed -n 's/^[Ll]ocation:[[:space:]]*//p' /tmp/access-headers.txt | tr -d '\r' | tail -1)
          echo "unauthenticated GET /monetization HTTP $code"
          if [ "$code" = '302' ] || [ "$code" = '303' ]; then
            echo "$location" | grep -Eiq '^https://[^/]*cloudflareaccess\.com/'
          else
            test "$code" = '401' -o "$code" = '403'
          fi
          ACCESS_CODE="$code" ACCESS_LOCATION="$location" node - <<'NODE'
          const fs=require('fs');
          let locationHost=null;
          try{locationHost=new URL(process.env.ACCESS_LOCATION).hostname}catch{}
          fs.writeFileSync('access-result.json',JSON.stringify({method:'GET',path:'/monetization',status:Number(process.env.ACCESS_CODE),locationHost},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monetization-deployment-inventory
          path: |
            deployment-status.json
            versions-list.json
            active-versions.json
            active-version-ids.txt
            active-runtime-contracts.json
            version-*.json
            runtime-*.json
            runtime-*.status
            access-result.json
          if-no-files-found: error
          retention-days: 7
