name: Build APK Panglima UMKM

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - codex/panglima-module-variants
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        shell: bash
        working-directory: "Panglima UMKM"

    steps:
      - name: Ambil source code
        uses: actions/checkout@v4

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Instal Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Siapkan Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Jalankan pengujian aplikasi
        run: node --test tests/app.test.js tests/device-worker.test.js certificate-worker/tests/worker.test.js onboarding-worker/tests/token-request-worker.test.mjs onboarding-worker/tests/token-request-addon.test.js onboarding-worker/tests/pretest-variant.test.js

      - name: Siapkan keystore signing release
        env:
          PANGLIMA_KEYSTORE_BASE64: ${{ secrets.PANGLIMA_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$PANGLIMA_KEYSTORE_BASE64" ]]; then
            echo "::error::Secret PANGLIMA_KEYSTORE_BASE64 belum tersedia."
            exit 1
          fi

          signing_keystore_path="$RUNNER_TEMP/panglima-umkm-release.jks"
          printf '%s' "$PANGLIMA_KEYSTORE_BASE64" | base64 --decode > "$signing_keystore_path"
          echo "PANGLIMA_KEYSTORE_PATH=$signing_keystore_path" >> "$GITHUB_ENV"

      - name: Validasi tiga workbook tanpa PDF
        run: |
          for module in insurance property mlm; do
            test -s "app/src/main/assets/modules/$module-workbook.pmod"
            test ! -e "app/src/main/assets/modules/$module.pmod"
          done
          test "$(find app/src/main/assets/modules -type f -name '*.pmod' | wc -l)" -eq 3

      - name: Build APK release bertanda tangan
        env:
          PANGLIMA_KEYSTORE_PASSWORD: ${{ secrets.PANGLIMA_KEYSTORE_PASSWORD }}
          PANGLIMA_KEY_ALIAS: ${{ secrets.PANGLIMA_KEY_ALIAS }}
          PANGLIMA_KEY_PASSWORD: ${{ secrets.PANGLIMA_KEY_PASSWORD }}
        run: |
          for variable in PANGLIMA_KEYSTORE_PASSWORD PANGLIMA_KEY_ALIAS PANGLIMA_KEY_PASSWORD; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Secret $variable belum tersedia."
              exit 1
            fi
          done

          gradle :app:assembleRelease --no-daemon

      - name: Verifikasi tanda tangan APK release
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs \
            app/build/outputs/apk/release/app-release.apk

      - name: Pastikan APK hanya berisi workbook modul
        run: |
          apk_file="app/build/outputs/apk/release/app-release.apk"
          for module in insurance property mlm; do
            unzip -Z1 "$apk_file" | grep -qx "assets/modules/$module-workbook.pmod"
            if unzip -Z1 "$apk_file" | grep -qx "assets/modules/$module.pmod"; then
              echo "::error::PDF $module masih berada di APK."
              exit 1
            fi
          done

      - name: Beri nama file APK
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Panglima-UMKM-v1.3.9-MODUL.apk

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: Panglima-UMKM-APK-MODUL-v1.3.9
          path: "Panglima UMKM/app/build/outputs/apk/release/Panglima-UMKM-v1.3.9-MODUL.apk"
          if-no-files-found: error
          retention-days: 30

